name: Integrated Constructor Yard Browser
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'tests/browserSmoke.mjs'
      - '.github/workflows/yard-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts three@0.186.0 playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify detailed lab, exact-mech garage deployment and return
        run: node tests/browserSmoke.mjs
